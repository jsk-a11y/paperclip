# Production-hardened Coolify deployment for Paperclip.
# Keep secrets and the canonical public URL in Coolify environment variables.
services:
  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    pids_limit: 2048
    stop_grace_period: 90s
    restart: unless-stopped

    # Coolify's reverse proxy reaches port 3100 over the private Docker network.
    # Do not publish a host port for an internet-facing deployment.
    expose:
      - "3100"

    environment:
      HOST: "0.0.0.0"
      PAPERCLIP_HOME: "/paperclip"
      NODE_ENV: "production"

      # LLM provider keys are optional for startup; at least one is needed
      # before agents can perform model-backed work.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"

      # Public production deployment behind Coolify TLS.
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?PAPERCLIP_PUBLIC_URL must be set}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"
      PAPERCLIP_AUTH_RATE_LIMIT_ENABLED: "true"
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-true}"
      PAPERCLIP_ISSUE_PRIVACY_MODE: "enforce"

      # Generate once, store in Coolify, and keep stable across restarts.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?PAPERCLIP_TOOL_ACTION_SIGNING_SECRET must be set}"

    volumes:
      - paperclip-data:/paperclip

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  paperclip-data:
